<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrade | Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --green: #00d166;
            --deep: #050b08;
            --panel: rgba(255, 255, 255, 0.1);
            --line: rgba(255, 255, 255, 0.18);
            --text: #f6fff9;
            --muted: rgba(246, 255, 249, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px;
            background:
                linear-gradient(120deg, rgba(0, 0, 0, 0.94), rgba(0, 50, 26, 0.76)),
                url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80&w=2200") center / cover;
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
        }

        main {
            width: min(560px, 100%);
            padding: 34px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: var(--panel);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(18px);
        }

        .eyebrow {
            margin: 0 0 18px;
            color: var(--green);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: "Space Grotesk", Inter, sans-serif;
            font-size: clamp(36px, 8vw, 62px);
            line-height: 0.98;
            letter-spacing: 0;
        }

        p {
            margin: 20px 0 0;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.65;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
            padding: 12px 16px;
            border: 1px solid rgba(0, 209, 102, 0.34);
            border-radius: 999px;
            background: rgba(0, 209, 102, 0.12);
            color: var(--text);
            font-weight: 700;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: var(--green);
            box-shadow: 0 0 20px rgba(0, 209, 102, 0.9);
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">QuantumTrade</p>
        <h1>Investor access is temporarily paused.</h1>
        <p>We are completing payment account maintenance. Account loading and investor dashboard access will resume after verification is complete.</p>
        <div class="status"><span class="dot"></span> Maintenance in progress</div>
    </main>
</body>
</html>
